version = 1

[*]
; add global presets here
parallel = 1
cache-ram = 32768
flash-attn = on
n-gpu-layers = 99
jinja = true
ub = 512
b = 2048
threads = 8
mmproj-offload = false

[gemma-4-31B-it-long-run]
load-on-startup = false
alias = gemma4-long-run
model = /models/gemma-4-31B-it-qat-UD-Q4_K_XL.gguf
temp = 1
top-p = 0.95
top-k = 64
presence-penalty = 0.0
repeat-penalty = 1.0
ctx-size = 128000
spec-draft-n-max=2
spec-type=draft-mtp,ngram-mod
cache-type-k=q4_0
cache-type-v=q4_0
model-draft = /models/mtp-gemma-4-31B-it-Q4_0.gguf

[gemma-4-31B-it-investigation]
load-on-startup = false
alias = gemma4-investigation
# https://huggingface.co/bartowski/google_gemma-4-31B-it-GGUF
model = /models/gemma-4-31B-it-qat-UD-Q4_K_XL.gguf
temp = 1
top-p = 0.95
top-k = 64
presence-penalty = 0.0
repeat-penalty = 1.0
ctx-size = 48000
spec-draft-n-max=2
spec-type=draft-mtp,ngram-mod
cache-type-k=bf16
cache-type-v=bf16
model-draft = /models/mtp-gemma-4-31B-it-Q4_0.gguf

[muse-glimmer-q5-30b]
load-on-startup = false
alias = muse-glimmer-q5
# https://huggingface.co/meta-models/Muse-Glimmer-30B-GGUF
model = /models/Muse-Glimmer-30B-AK-Q5_K_M.gguf
temp = 1
top-p = 0.95
top-k = 64
ctx-size = 131072
spec-draft-n-max=2
spec-type=draft-dflash,ngram-mod
model-draft = /models/glimmer-dflash-kquant.gguf

[Qwen3.8-27B-Q5_K_M]
load-on-startup = true
alias = qwen3.8-q5,qwen3.8-27b-q5
# https://huggingface.co/unsloth/Qwen3.8-27B-GGUF
model = /models/Qwen3.8-27B-UD-Q5_K_M.gguf
mmproj = /models/mmproj-F16.gguf
ctx-size=102000
temp = 1
top-p = 0.95
top-k = 20
min-p = 0.0
repeat-penalty = 1.0
spec-draft-n-max=2
spec-type=draft-mtp,ngram-mod
cache-type-k=q8_0
cache-type-v=q8_0

[Qwen3.8-27B-UD-Q4_K_XL]
load-on-startup = false
alias = qwen3.8-q4,qwen3.8-27b-q4
# https://huggingface.co/unsloth/Qwen3.8-27B-GGUF
model = /models/Qwen3.8-27B-UD-Q4_K_XL.gguf
mmproj = /models/mmproj-F16.gguf
ctx-size = 131072
temp = 1
top-p = 0.95
top-k = 20
min-p = 0.0
repeat-penalty = 1.0
spec-draft-n-max=2
spec-type=draft-mtp,ngram-mod
cache-type-k=q8_0
cache-type-v=q8_0
