version = 1

[*]
; add global presets here
parallel = 2
kv-unified = true
cache-ram = 16384
flash-attn = on
n-gpu-layers = 99
jinja = true
b = 512
ub = 4096
threads = 8
mmproj-offload = false

[gemma-4-31B-it]
load-on-startup = false
alias = gemma4
; gemma4 image chunks decode with non-causal attention: ubatch must fit the whole image in one shot
b = 512
# https://huggingface.co/bartowski/google_gemma-4-31B-it-GGUF
model = /models/gemma-4-31B-it-qat-UD-Q4_K_XL.gguf
temp = 1
top-p = 0.95
top-k = 64
presence-penalty = 0.0
repeat-penalty = 1.0
ctx-size = 40000
spec-draft-n-max=2
spec-type=draft-mtp,ngram-mod
cache-type-k=q8_0
cache-type-v=q8_0
model-draft = /models/mtp-gemma-4-31B-it-Q4_0.gguf
mmproj = /models/gemma-4-mmproj-F16.gguf

[muse-glimmer-q5-30b]
load-on-startup = false
alias = muse-glimmer-q5
# https://huggingface.co/meta-models/Muse-Glimmer-30B-GGUF
model = /models/Muse-Glimmer-30B-AK-Q5_K_M.gguf
temp = 1
top-p = 0.95
top-k = 64
ctx-size=85000
mmproj = /models/glimmer-mmproj-kquant.gguf
mmproj-offload = true  ; projector is small (kquant) - keep it in VRAM for faster image encoding

[Swift-Qwen3.8-27B-Q5_K_S]
load-on-startup = true
alias = qwen3.8-swift,swift-q5s
# https://huggingface.co/ukisai/Swift-1.5-Qwen3.8-27B-GGUF
model = /models/Swift-1.5-Qwen3.8-27B-Q5_K_S.gguf
mmproj = /models/qwen3.8-mmproj-F16.gguf
ctx-size = 106330
temp = 1
top-p = 0.95
top-k = 20
min-p = 0.0
repeat-penalty = 1.0
spec-draft-n-max=2
spec-type=draft-mtp,ngram-mod
cache-type-k=q8_0
cache-type-v=q8_0
