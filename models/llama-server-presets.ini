alias = Qwen3.6-27B,qwen3.6
model = /models/Qwen3.6-bartowski-27B-MTP-Q4_K_M.gguf
#ctx-size = 65536
ctx-size = 131072
#hf =  bartowski/Qwen_Qwen3.6-27B-GGUF:Q4_K_M
temp = 0.6
top-p = 0.8
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0
spec-draft-n-max=2
spec-type=draft-mtp,ngram-mod
cache-type-k=q8_0
cache-type-v=q8_0


