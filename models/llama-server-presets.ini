version = 1

[*]
; add global presets here
parallel = 1
cache-ram = 32768
flash-attn = on
n-gpu-layers = 99
jinja = true
ub = 1024
b = 1024
threads = 8
mmproj-offload = false

[Qwen3.6-bartowski-27B-MTP-Q4_K_M]
